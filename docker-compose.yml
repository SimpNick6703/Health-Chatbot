services:
  backend:
    build: ./backend
    ports:
      # Expose for direct local development if needed, but Nginx is main entrypoint
      - "8008:8000"
    env_file:
      - .env
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app_data:
